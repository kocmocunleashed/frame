name: Verify Frame
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test --log /tmp/frame-unit.log
      - run: bun run test:browser --log /tmp/frame-browser.log
      - run: bun run test:browser --config e2e/admin.config.ts
      - run: bun run test:browser --config e2e/agent.config.ts
      - run: bun run erxes:test
      - run: bun run erxes:build
      - run: bun run erxes:test:browser
      - run: bun run infra:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-verification
          path: |
            /tmp/frame-unit.log
            /tmp/frame-browser.log
            /tmp/frame-browser-results
            /tmp/frame-cdk-check
