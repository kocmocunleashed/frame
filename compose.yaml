name: frame
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frame_dev
      POSTGRES_USER: frame
      POSTGRES_PASSWORD: ${FRAME_POSTGRES_PASSWORD:?Run bun run setup to configure a private database password}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U frame -d frame_dev']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
