name: frame
services:
  mongo:
    image: mongo:7.0.45
    command: [mongod, --replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval 'try { rs.status().ok } catch { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"127.0.0.1:27017\"}]}).ok }' | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
volumes:
  mongo-data:
